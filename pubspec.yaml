name: bee_kind
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3

  cupertino_icons: ^1.0.8
  otp_pin_field: ^1.4.1
  image_picker:
  # map_location_picker:
  intl: 
  dio:
  shared_preferences:
  place_picker:
    path: locationpicker
  permission_handler: ^12.0.1
  carousel_slider: ^5.1.1
  flutter_rating: ^2.0.2
  dotted_border: ^3.1.0
  google_maps_flutter: ^2.13.1
  geolocator:
  syncfusion_flutter_charts: ^31.2.2
  url_launcher: ^6.3.2
  get: ^4.7.2
  fluttertoast: ^9.0.0
  connectivity_plus: ^7.0.0
  logger: ^2.6.2
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_messaging: ^16.0.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  extended_image: ^10.0.1
  shimmer: ^3.0.0
  webview_flutter: ^4.13.0
  geocoding: ^4.0.0
  flutter_stripe: ^12.1.1
  mask_text_input_formatter: ^2.9.0
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  webview_flutter_android: 

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/icons/

  fonts:
    - family: Raleway
      fonts:
        - asset: assets/font_family/Raleway/raleway-light.ttf
        - asset: assets/font_family/Raleway/raleway-medium.ttf
        - asset: assets/font_family/Raleway/raleway-bold.ttf
        # - asset: fonts/Schyler-Italic.ttf
        #   style: italic
